<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>KNF LIVE</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data: https:; media-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'">
<!-- จอไลฟ์ 9:16 ซ้อนชั้น: พื้นหลัง → คนขาย (ตัดฉากเขียวได้) / คลิปสินค้า → รูปสินค้า+ON AIR ด้านบน → การ์ดตะกร้าที่ปักอยู่ → ซับ
     LIVE Studio จับหน้าต่างนี้ (Window capture) + เสียงจากคอม -->
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family:'Leelawadee UI','Noto Sans Thai',sans-serif; }
  .full { position:absolute; inset:0; width:100%; height:100%; }
  #bg { object-fit:cover; }
  #bgfill { background:radial-gradient(circle at 50% 30%, #3a1020, #0b0d17 70%); }
  #clip { object-fit:cover; background:#000; }
  #pres, #talk { position:absolute; left:0; right:0; bottom:0; width:100%; height:100%; object-fit:cover; }
  #presCv { position:absolute; left:50%; bottom:0; transform:translateX(-50%); height:72%; }
  #top { position:absolute; top:3%; left:50%; transform:translateX(-50%); width:52%; display:flex; flex-direction:column; align-items:center; gap:1vh; }
  #onair { color:#7df; font-weight:900; font-size:3.2vh; letter-spacing:.3vh; padding:.4vh 2vh; border:.3vh solid #7df; border-radius:1vh; background:rgba(0,20,40,.55); text-shadow:0 0 1vh #3af; }
  #onair small { display:block; text-align:center; color:#f55; font-size:1.6vh; letter-spacing:.5vh; text-shadow:0 0 1vh #f00; }
  #topImg { max-width:100%; max-height:24vh; filter:drop-shadow(0 1.5vh 2vh rgba(0,0,0,.5)); border-radius:1.5vh; }
  #pin { position:absolute; right:4%; top:46%; width:34%; background:#fff; border:.5vh solid #f3c64a; border-radius:2vh; padding:1vh; box-shadow:0 1vh 3vh rgba(0,0,0,.45); }
  #pin img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:1.2vh; display:block; }
  #pin .n { position:absolute; top:-2.2vh; right:-1.6vh; background:linear-gradient(135deg,#a78bfa,#6d5df6); color:#fff; font-weight:800; font-size:2.6vh; min-width:4.4vh; height:4.4vh; border-radius:2.2vh; display:flex; align-items:center; justify-content:center; padding:0 1vh; box-sizing:border-box; border:.3vh solid #fff; }
  #pin .t { font-size:1.7vh; color:#222; margin-top:.6vh; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #pin .p { font-size:2.2vh; font-weight:800; color:#ff2d55; }
  #pin .p:empty { display:none; }
  /* ไม่มีคนขาย: รูปใหญ่ฝั่งซ้าย ไม่ชนการ์ดตะกร้าฝั่งขวา */
  #big { position:absolute; left:4%; top:22%; width:56%; display:flex; flex-direction:column; align-items:center; gap:2vh; }
  #big img { width:100%; max-height:40vh; object-fit:cover; border-radius:2.5vh; box-shadow:0 2vh 6vh rgba(0,0,0,.6); }
  #big b { color:#fff; font-size:3.2vh; text-align:center; text-shadow:0 0 1vh #000; }
  body.nopres #topImg { display:none; }
  #sub { position:absolute; left:5%; right:5%; bottom:11vh; color:#fff; font-size:3.2vh; font-weight:600; text-align:center; text-shadow:0 0 1vh #000, 0 0 1vh #000, 0 0 .4vh #000; }
  #cart { position:absolute; left:50%; bottom:3.5vh; transform:translateX(-50%); white-space:nowrap; background:#ff3b5c; color:#fff; font-size:2.8vh; font-weight:700; padding:1vh 4vh; border-radius:4vh; }
  .hide { display:none !important; }
</style>
</head>
<body>
<div id="bgfill" class="full"></div>
<img id="bg" class="full hide" alt="">
<video id="pres" muted loop playsinline class="hide"></video>
<video id="talk" playsinline class="hide"></video>
<canvas id="presCv" class="hide"></canvas>
<div id="big" class="hide"><img id="bigImg" alt=""><b id="bigName"></b></div>
<video id="clip" class="full hide" playsinline></video>
<div id="top" class="hide"><div id="onair">ON AIR<small>LIVE</small></div><img id="topImg" alt=""></div>
<div id="pin" class="hide"><div class="n" id="pinN">1</div><img id="pinImg" alt=""><div class="t" id="pinT"></div><div class="p" id="pinP"></div></div>
<div id="sub"></div>
<div id="cart">🛒 กดตะกร้าด้านล่างได้เลย</div>
<audio id="a"></audio>
<script>
  const $ = (id) => document.getElementById(id);
  const show = (id, on) => $(id).classList.toggle('hide', !on);
  let cfg = {}, done = null, keyOn = false;
  const finish = () => { const d = done; done = null; d && d(); };

  // ตัดฉากเขียว: วาดวิดีโอคนขายลง canvas แล้วทำพิกเซลสีเขียวให้ใส
  const cv = $('presCv'), cx = cv.getContext('2d', { willReadFrequently: true });
  let act = 'pres'; // วิดีโอคนขายที่โชว์อยู่: pres (วนเงียบ) หรือ talk (MuseTalk พูดตามเสียง)
  function keyLoop() {
    const v = $(act);
    if (keyOn && v.videoWidth && !v.paused) {
      const h = Math.min(v.videoHeight, 960), w = Math.round(v.videoWidth * h / v.videoHeight);
      if (cv.width !== w) { cv.width = w; cv.height = h; }
      cx.drawImage(v, 0, 0, w, h);
      const im = cx.getImageData(0, 0, w, h), d = im.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        if (g > 80 && g > r * 1.25 && g > b * 1.25) d[i + 3] = 0;
        else if (g > r && g > b) d[i + 1] = Math.max(r, b); // ลดขอบเขียวที่ล้นตามผม/ไหล่
      }
      cx.putImageData(im, 0, 0);
    }
    requestAnimationFrame(keyLoop);
  }
  requestAnimationFrame(keyLoop);

  // ตั้งค่าตอนเริ่มไลฟ์: { bg, presenter, greenKey, top }
  window.setup = (c) => {
    cfg = c || {};
    show('bg', !!cfg.bg); if (cfg.bg) $('bg').src = cfg.bg;
    keyOn = !!(cfg.presenter && cfg.greenKey);
    document.body.classList.toggle('nopres', !cfg.presenter);
    if (cfg.presenter) $('pres').src = cfg.presenter;
    talk();
  };
  // สินค้าที่ปักอยู่: { name, price, image, no }
  window.setProduct = (p) => {
    show('top', cfg.top !== false && !!p.image); $('topImg').src = p.image || '';
    show('pin', true); $('pinN').textContent = p.no; $('pinImg').src = p.image || ''; show('pinImg', !!p.image);
    $('pinT').textContent = p.name || ''; $('pinP').textContent = p.price || '';
    $('bigImg').src = p.image || ''; show('bigImg', !!p.image); $('bigName').textContent = p.name || '';
  };
  // ช่วง AI พูด: คนขาย (ถ้ามี) ไม่งั้นรูปสินค้าตัวใหญ่กลางจอ
  window.talk = () => {
    $('clip').pause(); show('clip', false);
    if (cfg.presenter) { act = 'pres'; show('talk', false); show('pres', !keyOn); show('presCv', keyOn); show('big', false); $('pres').play().catch(() => {}); }
    else { show('pres', false); show('presCv', false); show('big', true); }
  };
  // คลิปขายของของชิ้นที่ปัก เต็มจอ มีเสียงของคลิปเอง
  window.playClip = (src) => new Promise((res) => {
    finish(); done = res;
    const v = $('clip');
    $('sub').textContent = '';
    $('pres').pause(); show('clip', true);
    v.src = src; v.muted = false;
    v.onended = v.onerror = () => { talk(); finish(); };
    v.play().catch(() => { talk(); finish(); });
  });
  window.playLive = (src, line) => new Promise((res) => {
    finish(); done = res;
    const a = $('a');
    $('sub').textContent = line || '';
    a.src = src;
    a.onended = a.onerror = () => { $('sub').textContent = ''; finish(); };
    a.play().catch(finish);
  });
  // ประโยคที่ขยับปากแล้ว: สลับไปวิดีโอ talk ตอนเฟรมแรกพร้อม (ไม่กระพริบดำ) จบแล้วกลับไปคลิปวน
  const useVid = (id) => { act = id; show('pres', !keyOn && id === 'pres'); show('talk', !keyOn && id === 'talk'); };
  window.playTalk = (src, line) => new Promise((res) => {
    finish(); done = res;
    const t = $('talk');
    $('clip').pause(); show('clip', false); show('big', false); show('presCv', keyOn);
    const back = () => { $('sub').textContent = ''; t.pause(); useVid('pres'); $('pres').play().catch(() => {}); finish(); };
    t.onplaying = () => { useVid('talk'); $('pres').pause(); $('sub').textContent = line || ''; };
    t.onended = t.onerror = back;
    t.src = src; t.muted = false;
    t.play().catch(back);
  });
  window.stopLive = () => { $('talk').pause(); useVid('pres'); $('a').pause(); $('clip').pause(); $('pres').pause(); $('sub').textContent = ''; finish(); };
</script>
</body>
</html>
